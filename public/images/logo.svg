<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 240" fill="none">
  <!-- Warm cream background -->
  <rect width="320" height="240" rx="16" fill="#F4EFE6" />

  <!-- Logo Mark: Stylized JO + Smile Curve -->
  <g transform="translate(100, 30)">
    <!-- Letter J -->
    <path d="M 28 8 L 28 48 C 28 62 14 62 4 56 C 2 54 2 50 6 49 C 9 48 11 50 14 51 C 18 53 21 51 21 44 L 21 8 C 21 4 23 2 28 8 Z" 
          fill="#5C554E" />

    <!-- Letter O (overlapping / adjacent to J) -->
    <path d="M 75 10 C 93 10 106 23 106 41 C 106 59 93 72 75 72 C 57 72 44 59 44 41 C 44 23 57 10 75 10 Z M 75 18 C 62 18 52 28 52 41 C 52 54 62 64 75 64 C 88 64 98 54 98 41 C 98 28 88 18 75 18 Z" 
          fill="#5C554E" />

    <!-- Smile Curve under JO -->
    <path d="M 12 78 C 34 104 86 104 108 78" 
          stroke="#5C554E" stroke-width="8.5" stroke-linecap="round" fill="none" />
  </g>

  <!-- Brand Typography -->
  <g text-anchor="middle" transform="translate(160, 175)">
    <!-- JO DENTAL -->
    <text x="0" y="0" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="28" font-weight="700" fill="#5C554E" letter-spacing="4.5">JO DENTAL</text>
    <!-- DR. JAMIL ORTIZ -->
    <text x="0" y="24" font-family="'Inter', system-ui, -apple-system, sans-serif" font-size="12" font-weight="600" fill="#786F67" letter-spacing="5">DR. JAMIL ORTIZ</text>
  </g>
</svg>
